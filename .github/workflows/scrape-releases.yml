name: "Scrape Releases & Deploy"

# ─────────────────────────────────────────────────────────────────────────────
# Hardened 2026-09-03 (root-cause fixes for recurring failures):
#   1. BRANCH: everything runs on `master` (the default branch Vercel deploys).
#      `main` was one commit ahead and orphaned — deleted. Push to master only.
#   2. NO in-Actions Vercel build/deploy anymore. Vercel's GitHub integration
#      auto-deploys every push to master. Actions only scrapes, validates,
#      commits, and pings IndexNow once the live site shows the change.
#   3. HEARTBEAT: on every scheduled run with no release changes we still commit
#      data/scraper-status.json, so the repo stays active and GitHub never
#      auto-disables the schedule (it does that after ~60 days of no pushes).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 2 days at 06:00 UTC
    - cron: '0 6 */2 * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-and-publish
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Firecrawl CLI
        run: npm install -g firecrawl-cli

      - name: Run release scraper
        if: github.event_name != 'push'
        run: python scripts/scrape_releases.py
        env:
          PYTHONUNBUFFERED: "1"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Validate release data
        if: github.event_name != 'push'
        run: npm run validate:releases

      - name: Detect changes
        id: check
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release or scraper-status changes found"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            COUNT=$(python -c "import json; print(len(json.load(open('data/releases.json'))))" 2>/dev/null || echo "?")
            echo "release data changed — $COUNT entries"
          fi

      - name: Commit and push release data
        if: github.event_name != 'push' && steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "${{ secrets.VERCEL_GIT_EMAIL || 'actions@github.com' }}"
          git config --local user.name "Release Scraper"
          git add data/releases.json data/scraper-status.json
          git commit -m "auto-scrape: $(date '+%Y-%m-%d %H:%M UTC') — releases updated"
          git push

      - name: Heartbeat commit (keep schedule alive)
        # Runs only on schedule when nothing changed: bumps scraper-status.json
        # timestamp so the repo always has activity and GitHub keeps the cron armed.
        if: github.event_name != 'push' && steps.check.outputs.changed == 'false'
        run: |
          python - <<'EOF'
          import json, pathlib, datetime
          p = pathlib.Path('data/scraper-status.json')
          status = json.loads(p.read_text()) if p.exists() else {}
          status['last_run'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          status['mode'] = 'heartbeat'
          p.write_text(json.dumps(status, indent=2))
          EOF
          git config --local user.email "${{ secrets.VERCEL_GIT_EMAIL || 'actions@github.com' }}"
          git config --local user.name "Release Scraper"
          git add data/scraper-status.json
          git commit -m "heartbeat: scraper status $(date '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Wait for live site, then ping IndexNow (best effort)
        if: always() && !cancelled()
        run: |
          echo "Vercel auto-deploys this push. Polling the live site..."
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 20 https://audiosoftwarehub.online/guides 2>/dev/null | grep -Fq "Guides"; then
              echo "Live site is fresh (guides route reachable). Pinging IndexNow."
              curl -s -o /dev/null -w "IndexNow: %{http_code}\n" \
                "https://www.bing.com/indexnow?url=https://audiosoftwarehub.online/sitemap.xml&key=${{ secrets.INDEXNOW_KEY }}" || true
              exit 0
            fi
            echo "  attempt ${attempt}/30 — deploy not live yet..."
            sleep 10
          done
          echo "WARNING: /guides not verified within 5 minutes. Check the Vercel dashboard."
          echo "(This warning is non-fatal: the commit above is already pushed and Vercel deploys it.)"
          exit 0
