name: "Scrape Releases & Deploy"

on:
  schedule:
    # Run every 2 days at 06:00 UTC
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Install Firecrawl CLI
      run: npm install -g firecrawl-cli

    - name: Run release scraper
      run: python scripts/scrape_releases.py
      env:
        PYTHONUNBUFFERED: "1"
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

    - name: Check for changes
      id: check
      run: |
        if [ -z "$(git status --porcelain -- data/releases.json data/scraper-status.json)" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No release or scraper-status changes found"
        else
          COUNT=$(python -c "import json; d=json.load(open('data/releases.json')); print(len(d))")
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "release data/status updated — $COUNT entries"
        fi

    - name: Commit and push
      if: steps.check.outputs.changed == 'true'
      run: |
        git config --local user.email "${{ secrets.VERCEL_GIT_EMAIL }}"
        git config --local user.name "Release Scraper"
        git add data/releases.json data/scraper-status.json
        git commit -m "auto-scrape: $(date '+%Y-%m-%d %H:%M UTC') — releases updated"
        git push

    - name: Deploy to Vercel
      if: steps.check.outputs.changed == 'true'
      run: |
        set -euo pipefail
        npm i -g vercel
        npm i -g pnpm
        vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        DEPLOYMENT_URL="$(vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }} | tee /tmp/vercel-deploy.log | tail -n 1)"
        echo "Deployment URL: ${DEPLOYMENT_URL}"
        vercel alias set "${DEPLOYMENT_URL}" audiosoftwarehub.online --token=${{ secrets.VERCEL_TOKEN }}

        LATEST_SLUG="$(python -c 'import json; print(json.load(open("data/releases.json"))[0]["slug"])')"
        echo "Verifying audiosoftwarehub.online contains latest release slug: ${LATEST_SLUG}"
        for attempt in $(seq 1 12); do
          if curl -fsSL https://audiosoftwarehub.online | grep -Fq "${LATEST_SLUG}"; then
            echo "audiosoftwarehub.online is fresh"
            exit 0
          fi
          echo "Freshness check attempt ${attempt}/12 failed; retrying..."
          sleep 10
        done

        echo "audiosoftwarehub.online did not show the latest release after deployment"
        exit 1
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
