name: "Force Deploy (manual)"

# One-off escape hatch: deploys the current master to production via the Vercel
# CLI, bypassing the project's "Ignored Build Step" (which cancels Git-integration
# pushes). Trigger manually with `gh workflow run "Force Deploy (manual)"`.
# workflow_dispatch-only so it never runs automatically (no double-deploy).
#
# NOTE: links explicitly to `audiosoftwarehub.online` because the repo's
# VERCEL_PROJECT_ID secret is stale (points at the old `music-tech-directory`
# project, prj_WuAyNjBRTX0ZbhuBckjma2zHCu0H). Correct prod project id:
# prj_HLKzzEhw9TEBGPC2IoO14OgEORDl.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link to audiosoftwarehub.online project
        run: vercel link --yes --project audiosoftwarehub.online --scope projectsinternalbr
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production (force)
        run: vercel deploy --prod --force --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_HLKzzEhw9TEBGPC2IoO14OgEORDl
